# BLV assistant configuration
# Edit these values instead of touching code.

camera:
  device_index: 0        # OpenCV camera index (0 = default webcam)
  frame_width: 640
  frame_height: 480
  fps: 30

detection:
  model_path: "models/yolov8n.pt"   # auto-downloaded by ultralytics on first run
  confidence_threshold: 0.45
  # Only announce these COCO classes as obstacles. Empty list = all classes.
  obstacle_classes:
    - person
    - car
    - bicycle
    - motorcycle
    - bus
    - truck
    - dog
    - chair
    - bench
    - stairs   # not a real COCO class; placeholder if you fine-tune later
  run_every_n_frames: 5    # throttle detection to save CPU (every Nth frame)

description:
  model_name: "Salesforce/blip-image-captioning-base"
  device: "cpu"            # "cuda" if you have a GPU
  trigger_key: "d"         # key to press to request a scene description
  max_new_tokens: 40

audio:
  engine: "pyttsx3"        # offline TTS
  rate: 175                # words per minute
  volume: 1.0
  alert_cooldown_seconds: 4.0   # min seconds before repeating the same alert
  min_priority_gap_seconds: 0.8 # min seconds between any two spoken alerts

logging:
  level: "INFO"
  log_file: "logs/blv.log"
