[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blv-assistant"
version = "0.2.0"
description = "LLM-powered assistive prototype for blind/low-vision users: proactive hazard alerts + grounded conversational scene understanding"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["pipeline*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
